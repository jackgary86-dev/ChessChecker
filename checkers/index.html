<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Checkers</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <h1>⛃ Checkers</h1>
  <div class="topbar">
    <button id="newGame" class="primary">New game</button>
    <button id="undo">Undo</button>
    <a href="./history.html"><button id="historyLink">History</button></a>
    <a href="../index.html"><button id="menu">Menu</button></a>
  </div>
  <div class="players-row">
    <label class="player-edit"><span class="swatch red"></span>
      <input id="p1NameInput" maxlength="20" aria-label="Red player's name"></label>
    <span class="vs">vs</span>
    <label class="player-edit"><span class="swatch black"></span>
      <input id="p2NameInput" maxlength="20" aria-label="Black player's name"></label>
  </div>
  <div class="status-row">
    <span class="turn-pill red" id="turnPill">Red to move</span>
    <span class="banner hidden" id="banner"></span>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="trays">
    <div class="tray"><span id="redCapturedLabel">Red</span> captured: <span class="pieces" id="redCaptured"></span></div>
    <div class="tray"><span id="blackCapturedLabel">Black</span> captured: <span class="pieces" id="blackCaptured"></span></div>
  </div>
  <footer class="hint">Click a piece, then a highlighted square to move. Jumps are mandatory when available. Two players, one screen.</footer>
</div>
<script type="module" src="./checkers.js"></script>
</body>
</html>
